<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>対話型リアルタイム音声通訳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <header class="bg-slate-800 border-b border-slate-700 p-3 sm:p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center gap-2">
            <div class="flex items-center space-x-2 sm:space-x-3 overflow-hidden">
                <div class="bg-emerald-600 p-1.5 sm:p-2 rounded-lg text-white shrink-0">
                    <i class="fa-solid fa-language text-lg sm:text-xl"></i>
                </div>
                <div class="truncate">
                    <h1 class="font-bold text-sm sm:text-lg leading-tight truncate">対話型リアルタイム通訳</h1>
                    <p class="text-[10px] sm:text-xs text-slate-400 truncate">完全無料・対話UI版</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
                <button id="ttsToggle" onclick="toggleAutoTTS()" class="px-2 sm:px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 border border-slate-600 transition flex items-center gap-1 sm:gap-1.5">
                    <i class="fa-solid fa-volume-high" id="ttsIcon"></i>
                    <span id="ttsStatusText"><span class="hidden sm:inline">自動再生: </span>OFF</span>
                </button>
                <button onclick="openSettings()" class="p-1.5 sm:p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg transition" title="読み上げ速度の調整">
                    <i class="fa-solid fa-sliders text-base sm:text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full flex-1 p-3 flex flex-col gap-4">
        <div class="bg-slate-800 rounded-xl p-3 sm:p-4 border border-slate-700 shadow-lg space-y-3">
            
            <div class="flex items-center justify-between gap-2 bg-slate-900/60 p-2 sm:p-3 rounded-lg border border-slate-700/50">
                <div class="flex-1">
                    <label class="block text-[10px] text-emerald-400 uppercase tracking-wider mb-1 font-bold">あなた (Lang 1)</label>
                    <select id="lang1" onchange="onLangChange()" class="w-full bg-slate-800 text-sm font-medium rounded-md px-1 py-2 border border-slate-600 focus:outline-none focus:border-emerald-500">
                        <option value="ja-JP" selected>🇯🇵 日本語</option>
                        <option value="en-US">🇺🇸 英語</option>
                        <option value="ko-KR">🇰🇷 韓国語</option>
                        <option value="zh-CN">🇨🇳 中国語</option>
                    </select>
                </div>
                <div class="text-slate-500 pt-4 px-1">
                    <i class="fa-solid fa-comments text-lg sm:text-xl"></i>
                </div>
                <div class="flex-1">
                    <label class="block text-[10px] text-blue-400 uppercase tracking-wider mb-1 font-bold">相手 (Lang 2)</label>
                    <select id="lang2" onchange="onLangChange()" class="w-full bg-slate-800 text-sm font-medium rounded-md px-1 py-2 border border-slate-600 focus:outline-none focus:border-blue-500">
                        <option value="en-US" selected>🇺🇸 英語</option>
                        <option value="ja-JP">🇯🇵 日本語</option>
                        <option value="ko-KR">🇰🇷 韓国語</option>
                        <option value="zh-CN">🇨🇳 中国語</option>
                    </select>
                </div>
            </div>

            <!-- 2つの大きなマイクボタン -->
            <div class="flex gap-2 sm:gap-3 mt-1">
                <button id="micBtn1" onclick="toggleListening(1)" class="w-1/2 py-5 sm:py-6 px-2 rounded-xl font-bold flex flex-col items-center justify-center gap-2 bg-slate-700 hover:bg-emerald-600 text-white shadow-lg transition active:scale-95 border-2 border-emerald-600/30">
                    <i class="fa-solid fa-microphone text-3xl sm:text-4xl" id="micIcon1"></i>
                    <span id="micText1" class="text-sm sm:text-base">日本語を話す</span>
                </button>
                <button id="micBtn2" onclick="toggleListening(2)" class="w-1/2 py-5 sm:py-6 px-2 rounded-xl font-bold flex flex-col items-center justify-center gap-2 bg-slate-700 hover:bg-blue-600 text-white shadow-lg transition active:scale-95 border-2 border-blue-600/30">
                    <i class="fa-solid fa-microphone text-3xl sm:text-4xl" id="micIcon2"></i>
                    <span id="micText2" class="text-sm sm:text-base">英語を話す</span>
                </button>
            </div>

            <div id="manualInputContainer" class="flex items-center gap-2 pt-2 border-t border-slate-700/50 mt-1">
                <input type="text" id="manualTextInput" placeholder="テキストを入力して翻訳..." class="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 placeholder-slate-500 transition shadow-inner">
                <button onclick="translateManualText()" class="py-2.5 px-4 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold transition flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

            <div id="liveBox" class="hidden bg-slate-900/80 rounded-lg p-3 border border-emerald-500/30 text-sm space-y-1">
                <div class="flex items-center gap-2 text-xs text-emerald-400 font-medium">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span id="liveStatusText">音声を認識中...</span>
                </div>
                <p id="liveText" class="text-slate-300 italic min-h-[1.25rem]"></p>
            </div>
        </div>

        <div class="flex justify-between items-center px-1 mt-2">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left"></i> 対話履歴
            </h2>
            <div class="flex gap-4">
                <button onclick="downloadHistory()" class="text-xs text-emerald-500 hover:text-emerald-400 transition flex items-center gap-1 bg-slate-800 px-2 py-1 rounded">
                    <i class="fa-solid fa-download"></i> 保存
                </button>
                <button id="clearBtn" onclick="clearTranscripts(this)" class="text-xs text-slate-400 hover:text-red-400 transition flex items-center gap-1 bg-slate-800 px-2 py-1 rounded">
                    <i class="fa-solid fa-trash"></i> 全消去
                </button>
            </div>
        </div>

        <div id="transcriptList" class="flex-1 space-y-3 overflow-y-auto pb-10">
            <!-- Dynamic Items Inserted Here -->
        </div>
    </main>

    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-emerald-400"></i> 設定
                </h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">音声読み上げ速度: <span id="speedVal" class="text-emerald-400 font-bold">1.0</span>x</label>
                    <input type="range" id="ttsSpeed" min="0.7" max="1.5" step="0.1" value="1.0" oninput="document.getElementById('speedVal').innerText=this.value" class="w-full accent-emerald-500">
                </div>
            </div>
            <div class="flex justify-end pt-2">
                <button onclick="saveSettings()" class="px-5 py-2.5 rounded-lg text-sm bg-emerald-600 hover:bg-emerald-500 text-white font-semibold w-full">設定を閉じる</button>
            </div>
        </div>
    </div>

    <script>
        let recognition = null;
        let isListening = false;
        let activeSpeaker = 0; // 0=none, 1=lang1(You), 2=lang2(Partner)
        let autoTTS = false;
        let transcripts = [];
        let isSpeaking = false; 
        let wasListeningBeforeSpeak = false; 
        
        const STORAGE_KEY = 'realtime_translator_history';

        const LANG_MAP = {
            'ja-JP': { name: '日本語', flag: '🇯🇵', voiceLang: 'ja-JP', apiCode: 'ja', color: 'emerald' },
            'en-US': { name: '英語', flag: '🇺🇸', voiceLang: 'en-US', apiCode: 'en', color: 'blue' },
            'ko-KR': { name: '韓国語', flag: '🇰🇷', voiceLang: 'ko-KR', apiCode: 'ko', color: 'purple' },
            'zh-CN': { name: '中国語', flag: '🇨🇳', voiceLang: 'zh-CN', apiCode: 'zh-CN', color: 'red' }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initSpeechRecognition();
            loadSettings();
            loadTranscriptsFromStorage();
            renderTranscripts();
            updateButtonLabels();

            document.getElementById('manualTextInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') translateManualText();
            });
        });

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => { isListening = true; };

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        const finalSpeech = event.results[i][0].transcript.trim();
                        if (finalSpeech) {
                            const srcLang = activeSpeaker === 1 ? document.getElementById('lang1').value : document.getElementById('lang2').value;
                            const tgtLang = activeSpeaker === 1 ? document.getElementById('lang2').value : document.getElementById('lang1').value;
                            processTranslation(finalSpeech, srcLang, tgtLang, activeSpeaker);
                        }
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                const liveBox = document.getElementById('liveBox');
                const liveText = document.getElementById('liveText');
                if (interim) {
                    liveBox.classList.remove('hidden');
                    liveText.innerText = interim;
                } else {
                    liveBox.classList.add('hidden');
                }
            };

            recognition.onerror = (e) => {
                if (e.error === 'aborted' || e.error === 'no-speech') return; 
                console.error('Speech recognition error:', e.error);
                if (e.error === 'not-allowed') resetListeningUI();
            };

            recognition.onend = () => {
                isListening = false;
                if (isSpeaking) return;
                if (activeSpeaker !== 0) {
                    setTimeout(() => {
                        if (!isSpeaking && activeSpeaker !== 0) {
                            try { recognition.start(); } catch(err){}
                        }
                    }, 50);
                } else {
                    resetListeningUI();
                }
            };
        }

        function updateButtonLabels() {
            const l1 = document.getElementById('lang1').value;
            const l2 = document.getElementById('lang2').value;
            const name1 = LANG_MAP[l1].name;
            const name2 = LANG_MAP[l2].name;

            document.getElementById('micText1').innerText = name1 + 'を話す';
            document.getElementById('micText2').innerText = name2 + 'を話す';
            document.getElementById('manualTextInput').placeholder = `${name1}を入力して翻訳...`;

            const manualContainer = document.getElementById('manualInputContainer');
            if (l1 === 'ja-JP') manualContainer.style.display = 'flex';
            else manualContainer.style.display = 'none';
        }

        function onLangChange() {
            updateButtonLabels();
            if (activeSpeaker !== 0) {
                stopListening();
            }
        }

        function toggleListening(speakerNum) {
            if (activeSpeaker === speakerNum) {
                stopListening();
                return;
            }
            if (activeSpeaker !== 0) stopListening();
            
            setTimeout(() => { startListening(speakerNum); }, 100);
        }

        function startListening(speakerNum) {
            if (!recognition) {
                initSpeechRecognition();
                if (!recognition) { alert("マイクが利用できない環境です。"); return; }
            }
            try {
                activeSpeaker = speakerNum;
                recognition.lang = speakerNum === 1 ? document.getElementById('lang1').value : document.getElementById('lang2').value;
                
                if (!isSpeaking && !isListening) {
                    recognition.start();
                }
                wasListeningBeforeSpeak = false;
                updateListeningUI();
            } catch(e) {
                console.error(e);
            }
        }
        
        function stopListening() {
            activeSpeaker = 0;
            wasListeningBeforeSpeak = false;
            if (recognition && isListening) {
                try { recognition.stop(); } catch(e) {}
            }
            resetListeningUI();
        }

        function updateListeningUI() {
            const btn1 = document.getElementById('micBtn1');
            const btn2 = document.getElementById('micBtn2');
            
            btn1.className = 'w-1/2 py-5 sm:py-6 px-2 rounded-xl font-bold flex flex-col items-center justify-center gap-2 bg-slate-700 hover:bg-emerald-600 text-white shadow-lg transition active:scale-95 border-2 border-emerald-600/30';
            btn2.className = 'w-1/2 py-5 sm:py-6 px-2 rounded-xl font-bold flex flex-col items-center justify-center gap-2 bg-slate-700 hover:bg-blue-600 text-white shadow-lg transition active:scale-95 border-2 border-blue-600/30';
            
            const name1 = LANG_MAP[document.getElementById('lang1').value].name;
            const name2 = LANG_MAP[document.getElementById('lang2').value].name;

            document.getElementById('micIcon1').className = 'fa-solid fa-microphone text-3xl sm:text-4xl';
            document.getElementById('micIcon2').className = 'fa-solid fa-microphone text-3xl sm:text-4xl';
            document.getElementById('micText1').innerText = name1 + 'を話す';
            document.getElementById('micText2').innerText = name2 + 'を話す';

            if (activeSpeaker === 1) {
                btn1.className = 'w-1/2 py-5 sm:py-6 px-2 rounded-xl font-bold flex flex-col items-center justify-center gap-2 bg-red-600 text-white shadow-lg transition animate-pulse border-2 border-red-400';
                document.getElementById('micIcon1').className = 'fa-solid fa-ear-listen text-3xl sm:text-4xl';
                document.getElementById('micText1').innerText = '停止 (タップ)';
                document.getElementById('liveStatusText').innerText = name1 + 'を聞き取り中...';
            } else if (activeSpeaker === 2) {
                btn2.className = 'w-1/2 py-5 sm:py-6 px-2 rounded-xl font-bold flex flex-col items-center justify-center gap-2 bg-red-600 text-white shadow-lg transition animate-pulse border-2 border-red-400';
                document.getElementById('micIcon2').className = 'fa-solid fa-ear-listen text-3xl sm:text-4xl';
                document.getElementById('micText2').innerText = '停止 (タップ)';
                document.getElementById('liveStatusText').innerText = name2 + 'を聞き取り中...';
            }
        }

        function resetListeningUI() {
            activeSpeaker = 0;
            updateListeningUI();
            document.getElementById('liveBox').classList.add('hidden');
        }

        async function processTranslation(sourceText, srcLangVal, tgtLangVal, speakerId) {
            const item = {
                id: Date.now(),
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                srcLang: srcLangVal,
                tgtLang: tgtLangVal,
                original: sourceText,
                translated: '[翻訳取得中...]',
                loading: true,
                speaker: speakerId,
                isEditing: false // 編集モードのフラグ
            };

            transcripts.unshift(item);
            renderTranscripts();

            await executeTranslationApi(item);
        }

        async function executeTranslationApi(item) {
            const sourceApiCode = LANG_MAP[item.srcLang].apiCode;
            const targetApiCode = LANG_MAP[item.tgtLang].apiCode;
            const encodedText = encodeURIComponent(item.original);

            try {
                // 1. Google 翻訳の無料公開エンドポイント (GTX)
                const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceApiCode}&tl=${targetApiCode}&dt=t&q=${encodedText}`;
                let response = await fetch(gtxUrl);
                
                if (response.ok) {
                    const data = await response.json();
                    if (data && data[0]) {
                        item.translated = data[0].map(arr => arr[0]).join('');
                        finishTranslation(item);
                        return;
                    }
                }

                // 2. バックアップ: MyMemory API
                const myMemoryUrl = `https://api.mymemory.translated.net/get?q=${encodedText}&langpair=${sourceApiCode}|${targetApiCode}`;
                response = await fetch(myMemoryUrl);
                const data = await response.json();

                if (response.ok && data.responseData && data.responseData.translatedText) {
                    if (data.responseData.translatedText.includes("MYMEMORY_WARNING")) {
                        item.translated = `⚠️ 全ての無料翻訳エンジンの制限に達しました。`;
                    } else {
                        item.translated = data.responseData.translatedText;
                    }
                } else {
                    item.translated = `⚠️ 翻訳エラー`;
                }
            } catch (err) {
                console.error(err);
                item.translated = '⚠️ 通信エラー';
            } finally {
                finishTranslation(item);
            }
        }

        function finishTranslation(item) {
            item.loading = false;
            saveTranscriptsToStorage();
            renderTranscripts();
            if (autoTTS && !item.translated.startsWith('⚠️')) {
                speakText(item.translated, item.tgtLang);
            }
        }

        function translateManualText() {
            const inputEl = document.getElementById('manualTextInput');
            const text = inputEl.value.trim();
            if (text) {
                const src = document.getElementById('lang1').value;
                const tgt = document.getElementById('lang2').value;
                processTranslation(text, src, tgt, 1);
                inputEl.value = ''; 
            }
        }

        function saveTranscriptsToStorage() {
            try {
                const itemsToSave = transcripts.slice(0, 100); // 100件まで保存
                localStorage.setItem(STORAGE_KEY, JSON.stringify(itemsToSave));
            } catch (e) {
                console.error('Failed to save history', e);
            }
        }

        function loadTranscriptsFromStorage() {
            try {
                const storedData = localStorage.getItem(STORAGE_KEY);
                if (storedData) {
                    const parsedData = JSON.parse(storedData);
                    if (Array.isArray(parsedData)) {
                        // ロード時に編集モードフラグをリセット
                        transcripts = parsedData.map(t => ({...t, isEditing: false}));
                    }
                }
            } catch (e) {
                transcripts = [];
            }
        }

        let confirmClearTimeout;
        function clearTranscripts(btn) {
            if (btn.innerText.includes("本当に消去")) {
                transcripts = [];
                saveTranscriptsToStorage();
                renderTranscripts();
                btn.innerHTML = '<i class="fa-solid fa-trash"></i> 全消去';
                btn.classList.remove('text-red-400', 'font-bold');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> 本当に消去？';
                btn.classList.add('text-red-400', 'font-bold');
                clearTimeout(confirmClearTimeout);
                confirmClearTimeout = setTimeout(() => {
                    btn.innerHTML = '<i class="fa-solid fa-trash"></i> 全消去';
                    btn.classList.remove('text-red-400', 'font-bold');
                }, 3000);
            }
        }

        function deleteTranscript(id) {
            transcripts = transcripts.filter(item => item.id !== id);
            saveTranscriptsToStorage();
            renderTranscripts();
        }

        function downloadHistory() {
            if (transcripts.length === 0) {
                alert("保存する履歴がありません。");
                return;
            }
            let textContent = "--- 翻訳履歴バックアップ ---\n\n";
            // 古い順に出力するためにリバース
            [...transcripts].reverse().forEach(item => {
                const speaker = item.speaker === 1 ? "あなた" : "相手";
                textContent += `[${item.timestamp}] ${speaker}\n`;
                textContent += `原文: ${item.original}\n`;
                textContent += `翻訳: ${item.translated}\n`;
                textContent += `------------------------\n\n`;
            });
            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
            a.href = url;
            a.download = `translation_history_${dateStr}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function editTranscript(id) {
            const item = transcripts.find(t => t.id === id);
            if (item) {
                item.isEditing = true;
                renderTranscripts();
            }
        }

        function cancelEdit(id) {
            const item = transcripts.find(t => t.id === id);
            if (item) {
                item.isEditing = false;
                renderTranscripts();
            }
        }

        function saveAndRetranslate(id) {
            const item = transcripts.find(t => t.id === id);
            if (item) {
                const inputEl = document.getElementById(`edit-input-${id}`);
                const newText = inputEl.value.trim();
                if (newText && newText !== item.original) {
                    item.original = newText;
                    item.isEditing = false;
                    item.loading = true;
                    item.translated = '[再翻訳中...]';
                    renderTranscripts();
                    executeTranslationApi(item); // 再翻訳実行
                } else {
                    item.isEditing = false;
                    renderTranscripts();
                }
            }
        }

        function renderTranscripts() {
            const container = document.getElementById('transcriptList');
            if (transcripts.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-800/40 border border-dashed border-slate-700 rounded-xl p-8 text-center text-slate-500 mt-4">
                        <i class="fa-solid fa-comments text-4xl mb-3 block opacity-50"></i>
                        <p class="text-sm">ボタンを押して話し始めてください</p>
                    </div>`;
                return;
            }

            container.innerHTML = transcripts.map(item => {
                const isYou = item.speaker === 1;
                const borderColor = isYou ? 'border-emerald-500/30' : 'border-blue-500/30';
                const labelColor = isYou ? 'text-emerald-400' : 'text-blue-400';
                const labelText = isYou ? 'あなた' : '相手';

                return `
                <div class="bg-slate-800 rounded-xl p-4 border ${borderColor} shadow-md transition relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full ${isYou ? 'bg-emerald-500' : 'bg-blue-500'} opacity-50"></div>

                    <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-700/50 pb-2 mb-2 ml-2">
                        <span class="flex items-center gap-1.5 font-medium">
                            <span class="${labelColor} font-bold mr-1">${labelText}</span>
                            <span>${LANG_MAP[item.srcLang]?.flag || ''}</span>
                            <i class="fa-solid fa-arrow-right text-[10px] text-slate-500"></i>
                            <span>${LANG_MAP[item.tgtLang]?.flag || ''}</span>
                        </span>
                        <div class="flex items-center gap-3">
                            <span>${item.timestamp}</span>
                            <button onclick="deleteTranscript(${item.id})" class="text-slate-500 hover:text-red-400 transition" title="この履歴を削除">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>
                    </div>

                    <div class="space-y-2 ml-2">
                        <!-- 原文表示・編集エリア -->
                        <div class="text-xs text-slate-400 flex flex-wrap items-start justify-between gap-2">
                            ${item.isEditing ? `
                                <div class="flex items-center gap-2 w-full mt-1">
                                    <input type="text" id="edit-input-${item.id}" value="${escapeHtml(item.original)}" class="flex-1 bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                                    <button onclick="saveAndRetranslate(${item.id})" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1.5 rounded transition shadow">
                                        <i class="fa-solid fa-check"></i> 再翻訳
                                    </button>
                                    <button onclick="cancelEdit(${item.id})" class="text-xs bg-slate-600 hover:bg-slate-500 text-white px-2 py-1.5 rounded transition shadow">
                                        キャンセル
                                    </button>
                                </div>
                            ` : `
                                <p class="leading-relaxed flex-1 pt-1 text-sm">${escapeHtml(item.original)}</p>
                                <div class="flex gap-1 shrink-0">
                                    <button onclick="editTranscript(${item.id})" class="text-slate-500 hover:text-emerald-400 p-1.5 transition" title="文章を修正して再翻訳">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>
                                    <button onclick="speakText('${escapeQuotes(item.original)}', '${item.srcLang}')" class="text-slate-500 hover:text-slate-300 p-1.5 transition" title="原文読み上げ">
                                        <i class="fa-solid fa-volume-low"></i>
                                    </button>
                                </div>
                            `}
                        </div>

                        <!-- 翻訳結果エリア -->
                        <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-700/50 flex items-start justify-between gap-3">
                            <p class="text-sm font-medium ${item.loading ? 'text-emerald-400 animate-pulse' : 'text-slate-100'} leading-relaxed">
                                ${escapeHtml(item.translated)}
                            </p>
                            ${!item.loading && !item.translated.startsWith('⚠️') ? `
                                <button onclick="speakText('${escapeQuotes(item.translated)}', '${item.tgtLang}')" class="bg-slate-700 hover:bg-slate-600 text-white p-2 rounded-lg transition shrink-0" title="読み上げ">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function speakText(text, lang) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = LANG_MAP[lang] ? LANG_MAP[lang].voiceLang : lang;
            uttr.rate = parseFloat(localStorage.getItem('tts_speed') || '1.0');

            uttr.onstart = () => {
                isSpeaking = true;
                if (activeSpeaker !== 0) {
                    wasListeningBeforeSpeak = true;
                    if (recognition && isListening) {
                        try { recognition.abort(); } catch(e) {} 
                    }
                    const activeBtn = document.getElementById(`micBtn${activeSpeaker}`);
                    if(activeBtn) {
                        activeBtn.className = 'w-1/2 py-5 sm:py-6 px-2 rounded-xl font-bold flex flex-col items-center justify-center gap-2 bg-amber-600 text-white shadow-lg transition border-2 border-amber-400';
                        document.getElementById(`micText${activeSpeaker}`).innerText = '読み上げ中';
                        document.getElementById(`micIcon${activeSpeaker}`).className = 'fa-solid fa-volume-high animate-pulse text-3xl sm:text-4xl';
                    }
                }
            };

            uttr.onend = () => {
                isSpeaking = false;
                if (wasListeningBeforeSpeak) {
                    wasListeningBeforeSpeak = false;
                    if (activeSpeaker !== 0) {
                        updateListeningUI();
                        if (recognition) {
                            setTimeout(() => {
                                if(activeSpeaker !== 0) {
                                    try { recognition.start(); } catch(e) {}
                                }
                            }, 300); 
                        }
                    }
                }
            };

            uttr.onerror = () => { uttr.onend(); };
            window.speechSynthesis.speak(uttr);
        }

        function toggleAutoTTS() {
            autoTTS = !autoTTS;
            const btn = document.getElementById('ttsToggle');
            const text = document.getElementById('ttsStatusText');
            if (autoTTS) {
                btn.className = 'px-2 sm:px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-500 transition flex items-center gap-1 sm:gap-1.5 shadow';
                text.innerHTML = '<span class="hidden sm:inline">自動再生: </span>ON';
            } else {
                btn.className = 'px-2 sm:px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 border border-slate-600 transition flex items-center gap-1 sm:gap-1.5';
                text.innerHTML = '<span class="hidden sm:inline">自動再生: </span>OFF';
            }
        }

        function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
        function saveSettings() {
            localStorage.setItem('tts_speed', document.getElementById('ttsSpeed').value);
            closeSettings();
        }
        function loadSettings() {
            const speed = localStorage.getItem('tts_speed') || '1.0';
            document.getElementById('ttsSpeed').value = speed;
            document.getElementById('speedVal').innerText = speed;
        }
        function escapeHtml(str) { return str ? str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])) : ''; }
        function escapeQuotes(str) { return str ? str.replace(/'/g, "\\'").replace(/"/g, '\\"') : ''; }
    </script>
</body>
</html>
