<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイムAI音声通訳 (完全無料・制限回避版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 p-2 rounded-lg text-white">
                    <i class="fa-solid me-1 fa-language text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">リアルタイム通訳 (無制限版)</h1>
                    <p class="text-xs text-slate-400">設定不要・複数エンジン自動切替</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button id="ttsToggle" onclick="toggleAutoTTS()" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 border border-slate-600 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-volume-high" id="ttsIcon"></i>
                    <span id="ttsStatusText">自動再生: OFF</span>
                </button>
                <button onclick="openSettings()" class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg transition" title="読み上げ速度の調整">
                    <i class="fa-solid fa-sliders text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto w-full flex-1 p-4 flex flex-col gap-4">

        <!-- Control Panel -->
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-lg space-y-4">
            
            <!-- Language Selectors & Swap -->
            <div class="flex items-center justify-between gap-2 bg-slate-900/60 p-2 rounded-lg border border-slate-700/50">
                <div class="flex-1">
                    <label class="block text-[10px] text-slate-400 uppercase tracking-wider mb-1">話す言語 (入力)</label>
                    <select id="sourceLang" onchange="onLangChange()" class="w-full bg-slate-800 text-sm font-medium rounded-md px-2.5 py-1.5 border border-slate-600 focus:outline-none focus:border-emerald-500">
                        <option value="en-US">🇺🇸 英語 (English)</option>
                        <option value="ja-JP" selected>🇯🇵 日本語 (Japanese)</option>
                        <option value="ko-KR">🇰🇷 韓国語 (Korean)</option>
                    </select>
                </div>

                <button onclick="swapLanguages()" class="self-end mb-1 p-2 bg-slate-700 hover:bg-emerald-600 text-slate-300 hover:text-white rounded-md transition shadow" title="言語を入れ替え">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </button>

                <div class="flex-1">
                    <label class="block text-[10px] text-slate-400 uppercase tracking-wider mb-1">翻訳先 (出力)</label>
                    <select id="targetLang" onchange="onLangChange()" class="w-full bg-slate-800 text-sm font-medium rounded-md px-2.5 py-1.5 border border-slate-600 focus:outline-none focus:border-emerald-500">
                        <option value="en-US" selected>🇺🇸 英語 (English)</option>
                        <option value="ja-JP">🇯🇵 日本語 (Japanese)</option>
                        <option value="ko-KR">🇰🇷 韓国語 (Korean)</option>
                    </select>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap items-center gap-3">
                <button id="micBtn" onclick="toggleListening()" class="flex-1 py-3 px-6 rounded-lg font-bold flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg transition active:scale-95">
                    <i class="fa-solid fa-microphone text-lg" id="micIcon"></i>
                    <span id="micText">リスニング開始</span>
                </button>
                
                <button onclick="runDemo()" class="py-3 px-4 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold text-sm transition flex items-center gap-2 border border-slate-600">
                    <i class="fa-solid fa-play text-xs"></i>
                    <span>デモ音声テスト</span>
                </button>
            </div>

            <!-- Realtime Preview -->
            <div id="liveBox" class="hidden bg-slate-900/80 rounded-lg p-3 border border-emerald-500/30 text-sm space-y-1">
                <div class="flex items-center gap-2 text-xs text-emerald-400 font-medium">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    音声を認識中...
                </div>
                <p id="liveText" class="text-slate-300 italic min-h-[1.25rem]"></p>
            </div>
        </div>

        <!-- History Title -->
        <div class="flex justify-between items-center px-1">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left"></i> 翻訳履歴 (最新順)
            </h2>
            <button onclick="clearTranscripts()" class="text-xs text-slate-500 hover:text-red-400 transition">履歴消去</button>
        </div>

        <!-- Transcript Cards List -->
        <div id="transcriptList" class="flex-1 space-y-3 overflow-y-auto min-h-[300px]">
            <!-- Dynamic Items Inserted Here -->
        </div>

    </main>

    <!-- Settings Modal (Only for Audio Speed) -->
    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-emerald-400"></i> 設定
                </h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">音声読み上げ速度: <span id="speedVal" class="text-emerald-400 font-bold">1.0</span>x</label>
                    <input type="range" id="ttsSpeed" min="0.7" max="1.5" step="0.1" value="1.0" oninput="document.getElementById('speedVal').innerText=this.value" class="w-full accent-emerald-500">
                </div>
                <p class="text-xs text-slate-400 mt-2 p-2 bg-slate-900 rounded-lg">
                    ※ APIキーは不要です。Google公開APIとMyMemoryAPIを自動で切り替えて通信を安定させます。
                </p>
            </div>

            <div class="flex justify-end pt-2">
                <button onclick="saveSettings()" class="px-5 py-2.5 rounded-lg text-sm bg-emerald-600 hover:bg-emerald-500 text-white font-semibold w-full">設定を閉じる</button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let recognition = null;
        let isListening = false;
        let autoTTS = false;
        let transcripts = [];

        // Language codes for APIs
        const LANG_MAP = {
            'ja-JP': { name: '日本語', flag: '🇯🇵', voiceLang: 'ja-JP', apiCode: 'ja' },
            'en-US': { name: '英語', flag: '🇺🇸', voiceLang: 'en-US', apiCode: 'en' },
            'ko-KR': { name: '韓国語', flag: '🇰🇷', voiceLang: 'ko-KR', apiCode: 'ko' }
        };

        const DEMO_PHRASES = {
            'ja-JP': 'こんにちは。今日は複数のAPIを組み合わせた、新しい翻訳システムのテストを行っています。',
            'en-US': 'Hello everyone. We are testing a new translation system combining multiple APIs today.',
            'ko-KR': '안녕하세요. 오늘은 여러 API를 조합한 새로운 번역 시스템을 테스트하고 있습니다.'
        };

        window.addEventListener('DOMContentLoaded', () => {
            initSpeechRecognition();
            loadSettings();
            renderTranscripts();
        });

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('お使いのブラウザは音声認識に対応していません。Google ChromeまたはMicrosoft Edgeをご利用ください。');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = document.getElementById('sourceLang').value;

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        const finalSpeech = event.results[i][0].transcript.trim();
                        if (finalSpeech) {
                            processTranslation(finalSpeech);
                        }
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                const liveBox = document.getElementById('liveBox');
                const liveText = document.getElementById('liveText');
                if (interim) {
                    liveBox.classList.remove('hidden');
                    liveText.innerText = interim;
                } else {
                    liveBox.classList.add('hidden');
                }
            };

            recognition.onerror = (e) => {
                console.error('Speech recognition error:', e.error);
                if (e.error === 'not-allowed') {
                    alert('マイクの使用が拒否されています。ブラウザのアドレスバーのアイコンからマイクの権限を許可してください。');
                    stopListening();
                }
            };

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch(err){}
                } else {
                    stopListeningUI();
                }
            };
        }

        function toggleListening() {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        function startListening() {
            if (!recognition) initSpeechRecognition();
            try {
                recognition.lang = document.getElementById('sourceLang').value;
                recognition.start();
                isListening = true;
                document.getElementById('micBtn').className = 'flex-1 py-3 px-6 rounded-lg font-bold flex items-center justify-center gap-2 bg-red-600 hover:bg-red-500 text-white shadow-lg transition active:scale-95 animate-pulse';
                document.getElementById('micIcon').className = 'fa-solid fa-microphone-slash text-lg';
                document.getElementById('micText').innerText = 'リスニング停止';
            } catch(e) {
                console.error(e);
            }
        }

        function stopListening() {
            isListening = false;
            if (recognition) recognition.stop();
            stopListeningUI();
        }

        function stopListeningUI() {
            document.getElementById('micBtn').className = 'flex-1 py-3 px-6 rounded-lg font-bold flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg transition active:scale-95';
            document.getElementById('micIcon').className = 'fa-solid fa-microphone text-lg';
            document.getElementById('micText').innerText = 'リスニング開始';
            document.getElementById('liveBox').classList.add('hidden');
        }

        function swapLanguages() {
            const src = document.getElementById('sourceLang');
            const tgt = document.getElementById('targetLang');
            const tmp = src.value;
            src.value = tgt.value;
            tgt.value = tmp;
            onLangChange();
        }

        function onLangChange() {
            if (recognition && isListening) {
                recognition.stop();
                setTimeout(() => {
                    recognition.lang = document.getElementById('sourceLang').value;
                    recognition.start();
                }, 300);
            }
        }

        async function processTranslation(sourceText) {
            const srcLangVal = document.getElementById('sourceLang').value;
            const tgtLangVal = document.getElementById('targetLang').value;

            const item = {
                id: Date.now(),
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                srcLang: srcLangVal,
                tgtLang: tgtLangVal,
                original: sourceText,
                translated: '[翻訳取得中...]',
                loading: true
            };

            transcripts.unshift(item);
            renderTranscripts();

            const sourceApiCode = LANG_MAP[srcLangVal].apiCode;
            const targetApiCode = LANG_MAP[tgtLangVal].apiCode;
            const encodedText = encodeURIComponent(sourceText);

            try {
                // [1] メイン: Google Translate (公開エンドポイント/制限緩め)
                const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceApiCode}&tl=${targetApiCode}&dt=t&q=${encodedText}`;
                let response = await fetch(gtxUrl);
                
                if (response.ok) {
                    const data = await response.json();
                    if (data && data[0] && data[0][0] && data[0][0][0]) {
                        // 複数文に分かれている場合があるため結合
                        item.translated = data[0].map(arr => arr[0]).join('');
                        finishTranslation(item, tgtLangVal);
                        return; // 成功したらここで終了
                    }
                }

                // [2] バックアップ: MyMemory API (メインが失敗した時だけ使う)
                console.log("メインAPI失敗、MyMemory APIでリトライします...");
                const myMemoryUrl = `https://api.mymemory.translated.net/get?q=${encodedText}&langpair=${sourceApiCode}|${targetApiCode}`;
                response = await fetch(myMemoryUrl);
                const data = await response.json();

                if (response.ok && data.responseData && data.responseData.translatedText) {
                    if (data.responseData.translatedText.includes("MYMEMORY_WARNING")) {
                        item.translated = `⚠️ 両方の無料翻訳エンジンが制限に達しました。時間を置いてください。`;
                    } else {
                        item.translated = data.responseData.translatedText;
                    }
                } else {
                    item.translated = `⚠️ 翻訳エラー: サービスが混み合っています`;
                }

            } catch (err) {
                console.error(err);
                item.translated = '⚠️ 通信エラー: ネットワークを確認してください。';
            } finally {
                finishTranslation(item, tgtLangVal, false);
            }
        }

        // 翻訳完了時の処理（画面更新と音声読み上げ）
        function finishTranslation(item, tgtLangVal, isFallback = false) {
            item.loading = false;
            renderTranscripts();
            if (autoTTS && !item.translated.startsWith('⚠️')) {
                speakText(item.translated, tgtLangVal);
            }
        }

        function renderTranscripts() {
            const container = document.getElementById('transcriptList');
            if (transcripts.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-800/40 border border-dashed border-slate-700 rounded-xl p-8 text-center text-slate-500">
                        <i class="fa-solid fa-comment-dots text-3xl mb-2 block"></i>
                        「リスニング開始」を押して話すか、デモテストを実行してください
                    </div>`;
                return;
            }

            container.innerHTML = transcripts.map(item => `
                <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/80 shadow-md transition hover:border-slate-600">
                    <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-700/50 pb-2 mb-2">
                        <span class="flex items-center gap-1.5 font-medium">
                            <span>${LANG_MAP[item.srcLang].flag} ${LANG_MAP[item.srcLang].name}</span>
                            <i class="fa-solid fa-arrow-right text-[10px] text-slate-500"></i>
                            <span>${LANG_MAP[item.tgtLang].flag} ${LANG_MAP[item.tgtLang].name}</span>
                        </span>
                        <span>${item.timestamp}</span>
                    </div>

                    <div class="space-y-2">
                        <div class="text-xs text-slate-400 flex items-start justify-between gap-2">
                            <p class="leading-relaxed">${escapeHtml(item.original)}</p>
                            <button onclick="speakText('${escapeQuotes(item.original)}', '${item.srcLang}')" class="text-slate-500 hover:text-slate-300 p-1">
                                <i class="fa-solid fa-volume-low"></i>
                            </button>
                        </div>

                        <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-700/50 flex items-start justify-between gap-3">
                            <p class="text-sm font-medium ${item.loading ? 'text-emerald-400 animate-pulse' : 'text-slate-100'} leading-relaxed">
                                ${escapeHtml(item.translated)}
                            </p>
                            ${!item.loading && !item.translated.startsWith('⚠️') ? `
                                <button onclick="speakText('${escapeQuotes(item.translated)}', '${item.tgtLang}')" class="bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white p-2 rounded-lg transition shrink-0" title="読み上げ">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function speakText(text, lang) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = LANG_MAP[lang] ? LANG_MAP[lang].voiceLang : lang;
            uttr.rate = parseFloat(localStorage.getItem('tts_speed') || '1.0');
            window.speechSynthesis.speak(uttr);
        }

        function toggleAutoTTS() {
            autoTTS = !autoTTS;
            const btn = document.getElementById('ttsToggle');
            const text = document.getElementById('ttsStatusText');
            if (autoTTS) {
                btn.className = 'px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-500 transition flex items-center gap-1.5 shadow';
                text.innerText = '自動再生: ON';
            } else {
                btn.className = 'px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 border border-slate-600 transition flex items-center gap-1.5';
                text.innerText = '自動再生: OFF';
            }
        }

        function runDemo() {
            const srcLang = document.getElementById('sourceLang').value;
            const demoText = DEMO_PHRASES[srcLang] || DEMO_PHRASES['ja-JP'];
            processTranslation(demoText);
        }

        function clearTranscripts() {
            transcripts = [];
            renderTranscripts();
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            const speed = document.getElementById('ttsSpeed').value;
            localStorage.setItem('tts_speed', speed);
            closeSettings();
        }

        function loadSettings() {
            const speed = localStorage.getItem('tts_speed') || '1.0';
            document.getElementById('ttsSpeed').value = speed;
            document.getElementById('speedVal').innerText = speed;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
```

右側のエディタに完全に書き換わったコードを表示しました。

こちらをコピーして GitHub の `index.html` に貼り付けて上書き保存してください。
保存後、数分待ってからページをリロードしていただくと、APIキーの設定なしで、メインの翻訳エンジンが動作するはずです（MYMEMORYの制限に引っかからなくなります）！
