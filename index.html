<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイムAI音声通訳 (完全無料版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <header class="bg-slate-800 border-b border-slate-700 p-3 sm:p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center gap-2">
            <div class="flex items-center space-x-2 sm:space-x-3 overflow-hidden">
                <div class="bg-emerald-600 p-1.5 sm:p-2 rounded-lg text-white shrink-0">
                    <i class="fa-solid fa-language text-lg sm:text-xl"></i>
                </div>
                <div class="truncate">
                    <h1 class="font-bold text-sm sm:text-lg leading-tight truncate">リアルタイム通訳</h1>
                    <p class="text-[10px] sm:text-xs text-slate-400 truncate">無料・無制限版</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
                <button id="ttsToggle" onclick="toggleAutoTTS()" class="px-2 sm:px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 border border-slate-600 transition flex items-center gap-1 sm:gap-1.5">
                    <i class="fa-solid fa-volume-high" id="ttsIcon"></i>
                    <span id="ttsStatusText"><span class="hidden sm:inline">自動再生: </span>OFF</span>
                </button>
                <button onclick="openSettings()" class="p-1.5 sm:p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg transition" title="読み上げ速度の調整">
                    <i class="fa-solid fa-sliders text-base sm:text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full flex-1 p-3 sm:p-4 flex flex-col gap-4">
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-lg space-y-4">
            
            <!-- Language Selectors (Mobile Optimized) -->
            <div class="flex items-center justify-between gap-2 bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50">
                <div class="flex-1">
                    <label class="block text-[10px] text-slate-400 uppercase tracking-wider mb-1">話す言語 (入力)</label>
                    <select id="sourceLang" onchange="onLangChange()" class="w-full bg-slate-800 text-sm font-medium rounded-md px-2 py-2.5 border border-slate-600 focus:outline-none focus:border-emerald-500">
                        <option value="en-US">🇺🇸 英語 (English)</option>
                        <option value="ja-JP" selected>🇯🇵 日本語 (Japanese)</option>
                        <option value="ko-KR">🇰🇷 韓国語 (Korean)</option>
                    </select>
                </div>

                <button onclick="swapLanguages()" class="self-end mb-1 p-2.5 bg-slate-700 hover:bg-emerald-600 text-slate-300 hover:text-white rounded-md transition shadow" title="言語を入れ替え">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </button>

                <div class="flex-1">
                    <label class="block text-[10px] text-slate-400 uppercase tracking-wider mb-1">翻訳先 (出力)</label>
                    <select id="targetLang" onchange="onLangChange()" class="w-full bg-slate-800 text-sm font-medium rounded-md px-2 py-2.5 border border-slate-600 focus:outline-none focus:border-emerald-500">
                        <option value="en-US" selected>🇺🇸 英語 (English)</option>
                        <option value="ja-JP">🇯🇵 日本語 (Japanese)</option>
                        <option value="ko-KR">🇰🇷 韓国語 (Korean)</option>
                    </select>
                </div>
            </div>

            <!-- Action Button (Mobile Optimized) -->
            <div class="flex flex-col gap-3 mt-2">
                <button id="micBtn" onclick="toggleListening()" class="w-full py-4 px-6 rounded-xl font-bold flex items-center justify-center gap-3 bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg transition active:scale-95 text-lg">
                    <i class="fa-solid fa-microphone text-2xl" id="micIcon"></i>
                    <span id="micText">タップして話す</span>
                </button>
            </div>

            <!-- Manual Text Input -->
            <div id="manualInputContainer" class="flex items-center gap-2 pt-3 border-t border-slate-700/50 mt-2">
                <input type="text" id="manualTextInput" placeholder="日本語を入力して翻訳..." class="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 placeholder-slate-500 transition shadow-inner">
                <button onclick="translateManualText()" class="py-3 px-5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold transition flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-paper-plane text-lg"></i>
                </button>
            </div>

            <!-- Realtime Preview -->
            <div id="liveBox" class="hidden bg-slate-900/80 rounded-lg p-3 border border-emerald-500/30 text-sm space-y-1">
                <div class="flex items-center gap-2 text-xs text-emerald-400 font-medium">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    音声を認識中...
                </div>
                <p id="liveText" class="text-slate-300 italic min-h-[1.25rem]"></p>
            </div>
        </div>

        <!-- History Title -->
        <div class="flex justify-between items-center px-1">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left"></i> 翻訳履歴 (最新順)
            </h2>
            <button onclick="clearTranscripts()" class="text-xs text-slate-500 hover:text-red-400 transition">履歴消去</button>
        </div>

        <div id="transcriptList" class="flex-1 space-y-3 overflow-y-auto min-h-[300px]">
            <!-- Dynamic Items Inserted Here -->
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-emerald-400"></i> 設定
                </h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">音声読み上げ速度: <span id="speedVal" class="text-emerald-400 font-bold">1.0</span>x</label>
                    <input type="range" id="ttsSpeed" min="0.7" max="1.5" step="0.1" value="1.0" oninput="document.getElementById('speedVal').innerText=this.value" class="w-full accent-emerald-500">
                </div>
                <p class="text-xs text-slate-400 mt-2 p-2 bg-slate-900 rounded-lg">
                    ※ 翻訳履歴はブラウザ内に自動保存されます（最大数万件程度）。
                </p>
            </div>

            <div class="flex justify-end pt-2">
                <button onclick="saveSettings()" class="px-5 py-2.5 rounded-lg text-sm bg-emerald-600 hover:bg-emerald-500 text-white font-semibold w-full">設定を閉じる</button>
            </div>
        </div>
    </div>

    <script>
        let recognition = null;
        let isListening = false;
        let autoTTS = false;
        let transcripts = [];
        let isSpeaking = false; 
        let wasListeningBeforeSpeak = false; 
        
        // ローカルストレージに保存する際のキー名
        const STORAGE_KEY = 'realtime_translator_history';

        const LANG_MAP = {
            'ja-JP': { name: '日本語', flag: '🇯🇵', voiceLang: 'ja-JP', apiCode: 'ja' },
            'en-US': { name: '英語', flag: '🇺🇸', voiceLang: 'en-US', apiCode: 'en' },
            'ko-KR': { name: '韓国語', flag: '🇰🇷', voiceLang: 'ko-KR', apiCode: 'ko' }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initSpeechRecognition();
            loadSettings();
            loadTranscriptsFromStorage(); // 起動時に履歴を読み込む
            renderTranscripts();

            document.getElementById('manualTextInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    translateManualText();
                }
            });
            onLangChange(); // 初期の入力欄表示状態を設定
        });

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn('Speech recognition not supported on this browser/environment.');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = document.getElementById('sourceLang').value;

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        const finalSpeech = event.results[i][0].transcript.trim();
                        if (finalSpeech) {
                            processTranslation(finalSpeech);
                        }
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                const liveBox = document.getElementById('liveBox');
                const liveText = document.getElementById('liveText');
                if (interim) {
                    liveBox.classList.remove('hidden');
                    liveText.innerText = interim;
                } else {
                    liveBox.classList.add('hidden');
                }
            };

            recognition.onerror = (e) => {
                // 'aborted' は読み上げ時の意図的な停止などで発生するため、エラーログへの出力を抑制
                if (e.error === 'aborted') {
                    if (!isSpeaking) {
                        isListening = false;
                        stopListeningUI();
                    }
                    return;
                }
                
                console.error('Speech recognition error:', e.error);
                if (e.error === 'not-allowed') {
                    isListening = false;
                    stopListeningUI();
                }
            };

            recognition.onend = () => {
                if (isSpeaking) return;

                if (isListening) {
                    setTimeout(() => {
                        if (isListening && !isSpeaking) {
                            try { recognition.start(); } catch(err){}
                        }
                    }, 50);
                } else {
                    stopListeningUI();
                }
            };
        }

        function toggleListening() {
            if (isListening) stopListening();
            else startListening();
        }

        function startListeningUI() {
            document.getElementById('micBtn').className = 'w-full py-4 px-6 rounded-xl font-bold flex items-center justify-center gap-3 bg-red-600 hover:bg-red-500 text-white shadow-lg transition active:scale-95 animate-pulse text-lg';
            document.getElementById('micIcon').className = 'fa-solid fa-microphone-slash text-2xl';
            document.getElementById('micText').innerText = 'タップして停止';
        }

        function stopListeningUI() {
            document.getElementById('micBtn').className = 'w-full py-4 px-6 rounded-xl font-bold flex items-center justify-center gap-3 bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg transition active:scale-95 text-lg';
            document.getElementById('micIcon').className = 'fa-solid fa-microphone text-2xl';
            document.getElementById('micText').innerText = 'タップして話す';
            document.getElementById('liveBox').classList.add('hidden');
        }

        function startListening() {
            if (!recognition) {
                initSpeechRecognition();
                if (!recognition) {
                    alert("マイクが利用できない環境です。");
                    return;
                }
            }
            try {
                recognition.lang = document.getElementById('sourceLang').value;
                if (!isSpeaking) {
                    recognition.start();
                }
                isListening = true;
                wasListeningBeforeSpeak = false;
                startListeningUI();
            } catch(e) {
                console.error(e);
            }
        }
        
        function stopListening() {
            isListening = false;
            wasListeningBeforeSpeak = false;
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
            stopListeningUI();
        }

        function swapLanguages() {
            const src = document.getElementById('sourceLang');
            const tgt = document.getElementById('targetLang');
            const tmp = src.value;
            src.value = tgt.value;
            tgt.value = tmp;
            onLangChange();
        }

        function onLangChange() {
            if (recognition && isListening) {
                recognition.stop();
                setTimeout(() => {
                    recognition.lang = document.getElementById('sourceLang').value;
                    recognition.start();
                }, 300);
            }

            const srcLang = document.getElementById('sourceLang').value;
            const inputContainer = document.getElementById('manualInputContainer');
            if (inputContainer) {
                if (srcLang === 'ja-JP') {
                    inputContainer.classList.remove('hidden');
                    inputContainer.classList.add('flex');
                } else {
                    inputContainer.classList.remove('flex');
                    inputContainer.classList.add('hidden');
                }
            }
        }

        async function processTranslation(sourceText) {
            const srcLangVal = document.getElementById('sourceLang').value;
            const tgtLangVal = document.getElementById('targetLang').value;

            const item = {
                id: Date.now(),
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                srcLang: srcLangVal,
                tgtLang: tgtLangVal,
                original: sourceText,
                translated: '[翻訳取得中...]',
                loading: true
            };

            transcripts.unshift(item);
            renderTranscripts();

            const sourceApiCode = LANG_MAP[srcLangVal].apiCode;
            const targetApiCode = LANG_MAP[tgtLangVal].apiCode;
            const encodedText = encodeURIComponent(sourceText);

            try {
                const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceApiCode}&tl=${targetApiCode}&dt=t&q=${encodedText}`;
                let response = await fetch(gtxUrl);
                
                if (response.ok) {
                    const data = await response.json();
                    if (data && data[0]) {
                        item.translated = data[0].map(arr => arr[0]).join('');
                        finishTranslation(item, tgtLangVal);
                        return;
                    }
                }

                console.log("Fallback to MyMemory API...");
                const myMemoryUrl = `https://api.mymemory.translated.net/get?q=${encodedText}&langpair=${sourceApiCode}|${targetApiCode}`;
                response = await fetch(myMemoryUrl);
                const data = await response.json();

                if (response.ok && data.responseData && data.responseData.translatedText) {
                    if (data.responseData.translatedText.includes("MYMEMORY_WARNING")) {
                        item.translated = `⚠️ 全ての無料翻訳エンジンの制限に達しました。時間を置いてください。`;
                    } else {
                        item.translated = data.responseData.translatedText;
                    }
                } else {
                    item.translated = `⚠️ 翻訳エラー: サービスが混み合っています`;
                }

            } catch (err) {
                console.error(err);
                item.translated = '⚠️ 通信エラー: ネットワークを確認してください。';
            } finally {
                finishTranslation(item, tgtLangVal);
            }
        }

        function finishTranslation(item, tgtLangVal) {
            item.loading = false;
            saveTranscriptsToStorage(); // 翻訳完了時に履歴を保存
            renderTranscripts();
            if (autoTTS && !item.translated.startsWith('⚠️')) {
                speakText(item.translated, tgtLangVal);
            }
        }

        function translateManualText() {
            const inputEl = document.getElementById('manualTextInput');
            const text = inputEl.value.trim();
            if (text) {
                processTranslation(text);
                inputEl.value = ''; 
            }
        }

        // 履歴をローカルストレージに保存する
        function saveTranscriptsToStorage() {
            try {
                // 最大100件まで保存するように制限（ストレージ溢れ防止）
                const itemsToSave = transcripts.slice(0, 100);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(itemsToSave));
            } catch (e) {
                console.error('Failed to save history to localStorage', e);
            }
        }

        // 起動時にローカルストレージから履歴を読み込む
        function loadTranscriptsFromStorage() {
            try {
                const storedData = localStorage.getItem(STORAGE_KEY);
                if (storedData) {
                    const parsedData = JSON.parse(storedData);
                    if (Array.isArray(parsedData)) {
                        transcripts = parsedData;
                    }
                }
            } catch (e) {
                console.error('Failed to load history from localStorage', e);
                transcripts = []; // エラー時は空にする
            }
        }

        function clearTranscripts() {
            if (confirm("履歴をすべて消去してもよろしいですか？")) {
                transcripts = [];
                saveTranscriptsToStorage(); // 保存データも消去
                renderTranscripts();
            }
        }

        function renderTranscripts() {
            const container = document.getElementById('transcriptList');
            if (transcripts.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-800/40 border border-dashed border-slate-700 rounded-xl p-8 text-center text-slate-500 mt-4">
                        <i class="fa-solid fa-microphone-lines text-4xl mb-3 block opacity-50"></i>
                        <p class="text-sm">マイクボタンをタップして<br>話しかけてください</p>
                    </div>`;
                return;
            }

            container.innerHTML = transcripts.map(item => `
                <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/80 shadow-md transition hover:border-slate-600">
                    <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-700/50 pb-2 mb-2">
                        <span class="flex items-center gap-1.5 font-medium">
                            <span>${LANG_MAP[item.srcLang]?.flag || ''} ${LANG_MAP[item.srcLang]?.name || item.srcLang}</span>
                            <i class="fa-solid fa-arrow-right text-[10px] text-slate-500"></i>
                            <span>${LANG_MAP[item.tgtLang]?.flag || ''} ${LANG_MAP[item.tgtLang]?.name || item.tgtLang}</span>
                        </span>
                        <span>${item.timestamp}</span>
                    </div>

                    <div class="space-y-2">
                        <div class="text-xs text-slate-400 flex items-start justify-between gap-2">
                            <p class="leading-relaxed">${escapeHtml(item.original)}</p>
                            <button onclick="speakText('${escapeQuotes(item.original)}', '${item.srcLang}')" class="text-slate-500 hover:text-slate-300 p-1">
                                <i class="fa-solid fa-volume-low"></i>
                            </button>
                        </div>

                        <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-700/50 flex items-start justify-between gap-3">
                            <p class="text-sm font-medium ${item.loading ? 'text-emerald-400 animate-pulse' : 'text-slate-100'} leading-relaxed">
                                ${escapeHtml(item.translated)}
                            </p>
                            ${!item.loading && !item.translated.startsWith('⚠️') ? `
                                <button onclick="speakText('${escapeQuotes(item.translated)}', '${item.tgtLang}')" class="bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white p-2 rounded-lg transition shrink-0" title="読み上げ">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function speakText(text, lang) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = LANG_MAP[lang] ? LANG_MAP[lang].voiceLang : lang;
            uttr.rate = parseFloat(localStorage.getItem('tts_speed') || '1.0');

            uttr.onstart = () => {
                isSpeaking = true;
                if (isListening) {
                    wasListeningBeforeSpeak = true;
                    if (recognition) {
                        try { recognition.abort(); } catch(e) {} 
                    }
                    const micBtn = document.getElementById('micBtn');
                    micBtn.className = 'w-full py-4 px-6 rounded-xl font-bold flex items-center justify-center gap-3 bg-amber-500 text-white shadow-lg transition text-lg';
                    document.getElementById('micText').innerText = '読み上げ中 (マイク停止)';
                    document.getElementById('micIcon').className = 'fa-solid fa-volume-high animate-pulse text-2xl';
                }
            };

            uttr.onend = () => {
                isSpeaking = false;
                if (wasListeningBeforeSpeak) {
                    wasListeningBeforeSpeak = false;
                    if (isListening) {
                        startListeningUI();
                        if (recognition) {
                            setTimeout(() => {
                                try { recognition.start(); } catch(e) {}
                            }, 300); 
                        }
                    }
                }
            };

            uttr.onerror = (e) => {
                console.error("SpeechSynthesis error", e);
                uttr.onend(); 
            };

            window.speechSynthesis.speak(uttr);
        }

        function toggleAutoTTS() {
            autoTTS = !autoTTS;
            const btn = document.getElementById('ttsToggle');
            const text = document.getElementById('ttsStatusText');
            if (autoTTS) {
                btn.className = 'px-2 sm:px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-500 transition flex items-center gap-1 sm:gap-1.5 shadow';
                text.innerHTML = '<span class="hidden sm:inline">自動再生: </span>ON';
            } else {
                btn.className = 'px-2 sm:px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 border border-slate-600 transition flex items-center gap-1 sm:gap-1.5';
                text.innerHTML = '<span class="hidden sm:inline">自動再生: </span>OFF';
            }
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            const speed = document.getElementById('ttsSpeed').value;
            localStorage.setItem('tts_speed', speed);
            closeSettings();
        }

        function loadSettings() {
            const speed = localStorage.getItem('tts_speed') || '1.0';
            document.getElementById('ttsSpeed').value = speed;
            document.getElementById('speedVal').innerText = speed;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function escapeQuotes(str) {
            if (!str) return '';
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
